model:
  arch: video_llama
  model_type: pretrain_llama_v2

  # If you want use LLaMA-2-chat,
  # some ckpts could be download from our provided huggingface repo
  # i.e.  https://huggingface.co/DAMO-NLP-SG/Video-LLaMA-2-13B-Finetuned
  llama_model: "data/ad3_moviellama2_ce_iter14000.pth.tar"
  ckpt:  "./data/model-ckpt.pth.tar"
  ckpt_2: ""  # Optional
  equip_audio_branch: False


datasets:
  cmd_AD:
    vis_processor:
      train:
        name: "alpro_video_eval"
        n_frms: 8
        image_size: 224
    text_processor:
      train:
        name: "blip_caption"

run:
  task: video_text_pretrain